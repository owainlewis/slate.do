      {id:'SLT-126',title:'Add issue-quality task brief templates',status:'ready',priority:'P1',agent:'Research',repo:'slate.do',board:'Slate / Product',date:'Tomorrow',updated:'35 min',description:template,activity:[['Task assigned to Research','Ready to dispatch.','35 minutes ago']],runs:[]},
      {id:'SLT-125',title:'Link PR checks to the review queue',status:'blocked',priority:'P1',agent:'Builder',repo:'slate.do',board:'Slate / Integrations',date:'Thu',updated:'1 hr',description:template,activity:[['Run #1 blocked','GitHub App credentials are required.','1 hour ago']],runs:[{number:1,agent:'Builder',state:'Blocked',duration:'18m',branch:'codex/task-slt-125',result:'Waiting for credentials.'}]},
      {id:'SLT-124',title:'Draft the agent workflow teardown',status:'review',priority:'P1',agent:'Research',repo:'agents-course',board:'Content / YouTube',date:'Fri',updated:'2 hr',description:template,activity:[['Research submitted the draft','Ready for editorial review.','2 hours ago']],runs:[{number:1,agent:'Research',state:'Completed',duration:'48m',branch:'content/slt-124',result:'Drafted the lesson and examples.'}],delivery:{label:'Pull request #42',url:'https://github.com/owainlewis/agents-course/pull/42',title:'docs: agent workflow teardown',checks:'Content checks passed'}},
      {id:'SLT-123',title:'Improve onboarding empty states',status:'running',priority:'P2',agent:'Builder',repo:'site',board:'GradientWork / Website',date:'Next week',updated:'3 hr',description:template,activity:[['Builder claimed this task','Run #1 is active.','3 hours ago']],runs:[{number:1,agent:'Builder',state:'Running',duration:'3h',branch:'codex/task-slt-123',result:'Testing mobile layouts.'}]},
      {id:'SLT-122',title:'Compare agent dispatch options',status:'ready',priority:'P2',agent:'Research',repo:'slate.do',board:'Slate / Research',date:'Next week',updated:'Yesterday',description:template,activity:[['Task created','Added to Research queue.','Yesterday']],runs:[]},
      {id:'SLT-121',title:'Write launch email for the CLI',status:'ready',priority:'',agent:'Unassigned',repo:'agents-course',board:'Content / Writing',date:'Next week',updated:'Yesterday',description:template,activity:[['Task created','Unassigned.','Yesterday']],runs:[]}
    ];
    let selected='SLT-128',activeTab='brief',toastTimer;const el=id=>document.getElementById(id);const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=s=>({ready:'Ready',running:'Running',review:'Review',blocked:'Blocked',done:'Done'}[s]);const current=()=>tasks.find(t=>t.id===selected)||tasks[0];
    function row(t){const avatar=t.agent==='Research'?' research':t.agent==='Unassigned'?' unassigned':'';return '<button class="task-row'+(t.id===selected?' selected':'')+'" data-task="'+t.id+'"><span class="task-main"><span class="task-title">'+esc(t.title)+'</span><span class="task-meta"><span>'+t.id+'</span>'+(t.priority?'<span class="priority">'+t.priority+'</span>':'')+'<span>·</span><span>'+esc(t.board)+'</span></span></span><span class="status status-'+t.status+'">'+label(t.status)+'</span><span class="assignee"><span class="avatar'+avatar+'">'+(t.agent==='Unassigned'?'—':t.agent.slice(0,2).toUpperCase())+'</span>'+t.agent+'</span><span class="repo">'+esc(t.repo)+'</span><span class="updated">'+t.updated+'</span></button>'}
    function renderList(){const q=el('search').value.toLowerCase(),s=el('status-filter').value,a=el('agent-filter').value,r=el('repo-filter').value;const list=tasks.filter(t=>(!q||(t.title+' '+t.id+' '+t.repo).toLowerCase().includes(q))&&(!s||t.status===s)&&(!a||t.agent===a)&&(!r||t.repo===r));el('task-list').innerHTML=list.length?list.map(row).join(''):'<div class="empty"><strong>No matching tasks</strong><p>Try clearing a filter.</p></div>';el('result-count').textContent=list.length+(list.length===1?' task':' tasks');el('clear-filters').hidden=!(q||s||a||r);el('work-count').textContent=tasks.filter(t=>t.status!=='done').length;['ready','running','review','blocked'].forEach(x=>el(x+'-count').textContent=tasks.filter(t=>t.status===x).length);document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>openTask(b.dataset.task))}
    function openTask(id){selected=id;activeTab='brief';history.replaceState(null,'','#task/'+id);el('work-page').hidden=true;el('task-page').classList.add('active');renderDetail();closeNav();requestAnimationFrame(()=>el('back-to-work').focus())}function showWork(){history.replaceState(null,'',location.pathname);el('work-page').hidden=false;el('task-page').classList.remove('active');renderList();closeNav()}
    function renderDetail(){const t=current();el('detail-title').textContent=t.title;el('detail-id').textContent=el('breadcrumb-id').textContent=t.id;el('detail-board').textContent=t.board;el('detail-status').className='status status-'+t.status;el('detail-status').textContent=label(t.status);el('activity-count').textContent=t.activity.length;el('run-count').textContent=t.runs.length;el('property-state').innerHTML='<span class="status status-'+t.status+'">'+label(t.status)+'</span>';el('property-priority').textContent=t.priority||'None';el('property-agent').value=t.agent;el('property-repo').textContent=t.repo;el('property-board').textContent=t.board;el('property-date').textContent=t.date;el('permalink').textContent='slate.do/app/tasks/'+t.id;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));renderPanel(t);renderActions(t);renderRun(t);renderDelivery(t)}
    function renderActions(t){let a=['<button class="button" id="edit-brief">Edit brief</button>'];if(t.status==='ready')a.push('<button class="button primary" id="dispatch">Dispatch task</button>');if(t.status==='running')a.push('<button class="button" id="return-ready">Return to ready</button><button class="button primary" id="submit-delivery">Submit for review</button>');if(t.status==='blocked')a.push('<button class="button" id="return-ready">Return to ready</button>');if(t.status==='review')a.push('<button class="button danger" id="changes">Request changes</button><button class="button success" id="accept">Accept</button>');if(t.status==='done')a.push('<button class="button" id="reopen">Reopen</button>');el('task-actions').innerHTML=a.join('');el('edit-brief').onclick=editBrief;el('dispatch')?.addEventListener('click',dispatch);el('return-ready')?.addEventListener('click',stopRun);el('submit-delivery')?.addEventListener('click',submitDelivery);el('changes')?.addEventListener('click',requestChanges);el('accept')?.addEventListener('click',()=>changeState('done','Task accepted'));el('reopen')?.addEventListener('click',()=>changeState('ready','Task reopened'))}
    function md(text){let out='',list=false;String(text).split('\n').forEach(line=>{if(line.startsWith('## ')){if(list){out+='</ul>';list=false}out+='<h2>'+esc(line.slice(3))+'</h2>'}else if(line.startsWith('- [ ] ')){if(!list){out+='<ul>';list=true}out+='<li>'+esc(line.slice(6))+'</li>'}else if(line.trim()){if(list){out+='</ul>';list=false}out+='<p>'+esc(line).replace(/`([^`]+)`/g,'<code>$1</code>')+'</p>'}});return out+(list?'</ul>':'')}
    function renderPanel(t){if(activeTab==='brief')el('tab-panel').innerHTML='<article class="brief">'+md(t.description)+'<div class="callout"><strong>Execution contract:</strong> agents append run output and delivery evidence. They do not overwrite this brief.</div></article>';if(activeTab==='activity')el('tab-panel').innerHTML='<div class="timeline">'+t.activity.map(x=>'<div class="timeline-item"><span class="timeline-dot"></span><strong>'+esc(x[0])+'</strong><p>'+esc(x[1])+'</p><span class="timeline-time">'+x[2]+'</span></div>').join('')+'</div>';if(activeTab==='runs')el('tab-panel').innerHTML=t.runs.length?'<div class="timeline">'+t.runs.map(x=>'<div class="timeline-item"><span class="timeline-dot"></span><strong>Run #'+x.number+' · '+x.agent+' · '+x.state+'</strong><p>'+esc(x.result)+'</p><span class="timeline-time">'+x.duration+' · '+x.branch+'</span></div>').join('')+'</div>':'<div class="empty"><strong>No runs yet</strong><p>Dispatch this task to create an execution attempt.</p></div>'}
    function renderRun(t){const x=t.runs[0];el('run-card').innerHTML='<h2>Latest run</h2>'+(x?'<div class="run-card"><div class="run-head"><span class="avatar">'+x.agent.slice(0,2).toUpperCase()+'</span><div><strong>'+x.agent+' · Run #'+x.number+'</strong><small>'+x.state+'</small></div><span class="run-state'+(x.state==='Completed'?' done':'')+'"></span></div><div class="run-data"><div><span>Duration</span><strong>'+x.duration+'</strong></div><div><span>Branch</span><code>'+x.branch+'</code></div><div><span>Result</span><strong>'+esc(x.result)+'</strong></div></div></div>':'<div class="run-card"><p>No execution attempt yet. Dispatch when the brief is ready.</p></div>')}
    function renderDelivery(t){const state=t.status==='done'?'Accepted':t.status==='review'?'Ready for review':t.runs[0]?.state==='Changes requested'?'Changes requested':'Linked';el('delivery-card').innerHTML='<h2>Delivery</h2>'+(t.delivery?'<div class="delivery-card"><div class="run-head"><span class="avatar unassigned">PR</span><div><strong>'+esc(t.delivery.label)+'</strong><small>'+state+'</small></div></div><a class="delivery-link" href="'+esc(t.delivery.url)+'" target="_blank" rel="noreferrer">'+esc(t.delivery.title)+'</a><strong class="checks">✓ '+esc(t.delivery.checks)+'</strong></div>':'<div class="delivery-card"><p>No artifact submitted. A PR or document will appear here.</p></div>')}
    function dispatch(){const t=current();if(t.agent==='Unassigned')return toast('Assign an agent before dispatching.');t.status='running';t.updated='now';const x={number:t.runs.length+1,agent:t.agent,state:'Running',duration:'just started',branch:'codex/task-'+t.id.toLowerCase(),result:'Agent received the brief and repository context.'};t.runs.unshift(x);t.activity.unshift([t.agent+' claimed this task','Run #'+x.number+' started from '+x.branch+'.','Just now']);renderDetail();toast(t.agent+' is running '+t.id+'.')}
    function activeRun(t){return t.runs.find(run=>run.state==='Running')}
    function stopRun(){const t=current(),run=activeRun(t);if(run){run.state='Stopped';run.duration='stopped now';run.result='Run stopped and task returned to Ready.'}changeState('ready','Run stopped')}
    function requestChanges(){const t=current();if(t.runs[0]?.state==='Completed')t.runs[0].state='Changes requested';changeState('ready','Changes requested')}
    function changeState(s,title){const t=current();t.status=s;t.updated='now';t.activity.unshift([title,'Workflow state updated with an immutable activity event.','Just now']);renderDetail();toast(title+'.')}
    function modal(html){el('modal-root').innerHTML='<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true">'+html+'</section></div>';document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelector('[data-backdrop]').onclick=e=>{if(e.target.hasAttribute('data-backdrop'))closeModal()}}function closeModal(){el('modal-root').innerHTML=''}
    function editBrief(){const t=current();modal('<header class="modal-head"><h2>Edit task brief</h2><button class="modal-close" data-close aria-label="Close">×</button></header><form id="edit-form"><div class="modal-body"><div class="editor-tabs"><button class="editor-tab active" type="button" data-mode="write">Write</button><button class="editor-tab" type="button" data-mode="preview">Preview</button></div><div class="field"><label for="edit-description">Markdown brief</label><textarea id="edit-description">'+esc(t.description)+'</textarea><div class="preview brief" id="edit-preview" hidden></div><span class="help">Use Context, Outcome, Acceptance criteria, and Checks.</span></div></div><footer class="modal-actions"><button class="button" type="button" data-close>Cancel</button><button class="button primary" type="submit">Save brief</button></footer></form>');el('edit-description').focus();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const preview=b.dataset.mode==='preview';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));el('edit-description').hidden=preview;el('edit-preview').hidden=!preview;if(preview)el('edit-preview').innerHTML=md(el('edit-description').value)});el('edit-form').onsubmit=e=>{e.preventDefault();t.description=el('edit-description').value;t.activity.unshift(['Owain updated the brief','The task contract changed without altering run output.','Just now']);closeModal();renderDetail();toast('Task brief saved.')}}
    function submitDelivery(){const t=current();modal('<header class="modal-head"><h2>Submit for review</h2><button class="modal-close" data-close aria-label="Close">×</button></header><form id="delivery-form"><div class="modal-body"><div class="form-grid"><div class="field full"><label for="delivery-summary">Outcome summary</label><textarea id="delivery-summary" required placeholder="What changed and why?" style="min-height:110px"></textarea></div><div class="field full"><label for="delivery-url">PR or MR URL</label><input id="delivery-url" type="url" required aria-describedby="delivery-url-error" value="https://github.com/owainlewis/'+esc(t.repo)+'/pull/"><span class="help" id="delivery-url-error" role="alert"></span></div><div class="field full"><label for="delivery-checks">Verification evidence</label><input id="delivery-checks" required value="Focused tests and browser checks pass"></div></div></div><footer class="modal-actions"><button class="button" type="button" data-close>Cancel</button><button class="button primary" type="submit">Submit delivery</button></footer></form>');el('delivery-summary').focus();el('delivery-url').oninput=()=>{el('delivery-url').setCustomValidity('');el('delivery-url-error').textContent=''};el('delivery-form').onsubmit=e=>{e.preventDefault();const summary=el('delivery-summary').value.trim(),url=el('delivery-url').value,checks=el('delivery-checks').value.trim(),match=url.match(/\/(pull|merge_requests)\/(\d+)(?:\/|$)/);if(!match){const message='Enter a PR or MR URL with a concrete number.';el('delivery-url').setCustomValidity(message);el('delivery-url-error').textContent=message;el('delivery-url').reportValidity();return}const run=activeRun(t);if(run){run.state='Completed';run.duration='24m';run.result=summary}t.delivery={label:(match[1]==='merge_requests'?'Merge request #':'Pull request #')+match[2],url,title:summary,checks};t.status='review';t.updated='now';t.activity.unshift([t.agent+' submitted work for review',summary+' Verification: '+checks+'.','Just now']);closeModal();renderDetail();toast(t.id+' is ready for review.')}}
    function newTask(){modal('<header class="modal-head"><h2>New task</h2><button class="modal-close" data-close aria-label="Close">×</button></header><form id="new-form"><div class="modal-body"><div class="form-grid"><div class="field full"><label for="task-title">Title</label><input id="task-title" required placeholder="What needs to change?"></div><div class="field"><label for="task-agent">Agent</label><select id="task-agent"><option>Unassigned</option><option selected>Builder</option><option>Research</option></select></div><div class="field"><label for="task-repo">Repository</label><select id="task-repo"><option selected>slate.do</option><option>agents-course</option><option>site</option></select></div><div class="field full"><label for="task-description">Brief</label><textarea id="task-description">'+esc(template)+'</textarea><span class="help">A complete brief lets an agent start without clarification.</span></div></div></div><footer class="modal-actions"><button class="button" type="button" data-close>Cancel</button><button class="button primary" type="submit">Create task</button></footer></form>');el('task-title').focus();el('new-form').onsubmit=e=>{e.preventDefault();const id='SLT-'+(Math.max(...tasks.map(t=>Number(t.id.split('-')[1])))+1);const t={id,title:el('task-title').value.trim(),status:'ready',priority:'',agent:el('task-agent').value,repo:el('task-repo').value,board:'Slate / Inbox',date:'Unplanned',updated:'now',description:el('task-description').value,activity:[['Task created','Brief captured and assigned to '+el('task-agent').value+'.','Just now']],runs:[]};tasks.unshift(t);closeModal();openTask(id);toast(id+' created.')}}
    function toast(message){clearTimeout(toastTimer);el('toast').textContent=message;el('toast').hidden=false;toastTimer=setTimeout(()=>el('toast').hidden=true,2600)}function openNav(){el('sidebar').classList.add('open');el('mobile-overlay').classList.add('active');el('menu-button').setAttribute('aria-expanded','true')}function closeNav(){el('sidebar').classList.remove('open');el('mobile-overlay').classList.remove('active');el('menu-button').setAttribute('aria-expanded','false')}function copyLink(){const link=location.href;navigator.clipboard?.writeText(link);toast('Link copied: '+link)}
    ['search','status-filter','agent-filter','repo-filter'].forEach(id=>el(id).addEventListener(id==='search'?'input':'change',renderList));el('clear-filters').onclick=()=>{['search','status-filter','agent-filter','repo-filter'].forEach(id=>el(id).value='');renderList()};el('new-task').onclick=newTask;el('back-to-work').onclick=el('work-nav').onclick=showWork;el('menu-button').onclick=()=>el('sidebar').classList.contains('open')?closeNav():openNav();el('mobile-overlay').onclick=closeNav;el('copy-current').onclick=el('copy-permalink').onclick=copyLink;el('property-agent').onchange=e=>{const t=current();t.agent=e.target.value;t.activity.unshift(['Task assigned to '+t.agent,'Assignment updated by Owain.','Just now']);renderDetail();toast('Assigned to '+t.agent+'.')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(el('modal-root').children.length)closeModal();else closeNav()}if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&el('modal-root').children.length)document.querySelector('#modal-root form')?.requestSubmit()});renderList();if(location.hash.startsWith('#task/')){const id=location.hash.slice(6);if(tasks.some(t=>t.id===id))openTask(id)}
  </script>
