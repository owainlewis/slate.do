steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: sh
    args:
      - scripts/verify-github-ci.sh
      - $COMMIT_SHA
  - name: golang:1.26
    entrypoint: bash
    args:
      - -ceu
      - |
        cd server
        go test ./...
        cd ../cli
        go test ./...
        cd ..
        sh scripts/test-cloudbuild.sh
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/slate/slate:$COMMIT_SHA-$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/slate/slate:$COMMIT_SHA-$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        lock_uri="gs://${PROJECT_ID}_cloudbuild/deploy/slate.lock"
        lock_generation=""
        job_created=0
        cleanup() {
          rc=$$?
          trap - EXIT INT TERM
          if [ "$$job_created" = 1 ]; then
            gcloud run jobs delete "slate-migrate-$SHORT_SHA" --region "$_REGION" --quiet || true
          fi
          if [ -n "$$lock_generation" ]; then
            gcloud storage rm "$$lock_uri" --if-generation-match="$$lock_generation" --quiet || true
          fi
          exit "$$rc"
        }
        trap cleanup EXIT INT TERM

        while :; do
          if printf '%s' "$BUILD_ID" | gcloud storage cp - "$$lock_uri" --if-generation-match=0 --quiet 2>/tmp/slate-lock-error; then
            lock_generation="$$(gcloud storage objects describe "$$lock_uri" --format='value(generation)')"
            break
          fi

          if ! lock_details="$$(gcloud storage objects describe "$$lock_uri" --format='value(generation)' 2>/dev/null)"; then
            if printf '%s' "$BUILD_ID" | gcloud storage cp - "$$lock_uri" --if-generation-match=0 --quiet 2>/tmp/slate-lock-error; then
              lock_generation="$$(gcloud storage objects describe "$$lock_uri" --format='value(generation)')"
              break
            fi
            if ! lock_details="$$(gcloud storage objects describe "$$lock_uri" --format='value(generation)' 2>/dev/null)"; then
              echo "Unable to create or inspect the production deployment lock" >&2
              grep . /tmp/slate-lock-error >&2 || true
              exit 1
            fi
          fi

          owner="$$(gcloud storage cat "$$lock_uri" 2>/dev/null || true)"
          owner_status="$$(gcloud builds describe "$$owner" --project "$PROJECT_ID" --format='value(status)' 2>/dev/null || true)"
          case "$$owner_status" in
            QUEUED|PENDING|WORKING)
              echo "Waiting for production deployment lock held by build $$owner"
              ;;
            SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
              echo "Removing abandoned production deployment lock from build $$owner"
              gcloud storage rm "$$lock_uri" --if-generation-match="$$lock_details" --quiet || true
              ;;
            *)
              echo "Could not verify production deployment lock owner $$owner; waiting safely" >&2
              ;;
          esac
          sleep 10
        done

        latest="$$(git ls-remote https://github.com/owainlewis/slate.do.git refs/heads/main | cut -f1)"
        test "$$latest" = "$COMMIT_SHA" || {
          echo "Refusing to deploy stale build $COMMIT_SHA; main is $$latest" >&2
          exit 1
        }

        image_tag="$_REGION-docker.pkg.dev/$PROJECT_ID/slate/slate:$COMMIT_SHA-$BUILD_ID"
        image="$$(gcloud artifacts docker images describe "$$image_tag" --format='value(image_summary.fully_qualified_digest)')"
        test -n "$$image"
        runtime_secrets="DATABASE_URL=slate-database-url:latest,SESSION_SECRET=slate-session-secret:latest,RESEND_API_KEY=slate-resend-api-key:latest"
        sh scripts/validate-capacity.sh "$_MAX_INSTANCES" "$_DB_MAX_CONNECTIONS" "$_DB_CONNECTION_ALLOWANCE" "$_DB_RESERVED_CONNECTIONS" "$_REQUEST_TIMEOUT_SECONDS"
        runtime_env="COOKIE_SECURE=true,APP_BASE_URL=https://slate.do,RESEND_FROM=Slate <passwords@mail.slate.do>,APP_MAX_INSTANCES=$_MAX_INSTANCES,DB_MAX_CONNECTIONS=$_DB_MAX_CONNECTIONS,DB_CONNECTION_ALLOWANCE=$_DB_CONNECTION_ALLOWANCE,DB_RESERVED_CONNECTIONS=$_DB_RESERVED_CONNECTIONS,DB_ACQUIRE_TIMEOUT=$_DB_ACQUIRE_TIMEOUT,DB_STATEMENT_TIMEOUT=$_DB_STATEMENT_TIMEOUT,DB_IDLE_TRANSACTION_TIMEOUT=$_DB_IDLE_TRANSACTION_TIMEOUT,DB_MAX_CONNECTION_IDLE_TIME=$_DB_MAX_CONNECTION_IDLE_TIME,DB_MAX_CONNECTION_LIFETIME=$_DB_MAX_CONNECTION_LIFETIME,REQUEST_TIMEOUT=${_REQUEST_TIMEOUT_SECONDS}s,HTTP_IDLE_TIMEOUT=$_HTTP_IDLE_TIMEOUT"
        existing_service="$$(gcloud run services list --region "$_REGION" --filter='metadata.name=slate' --format='value(metadata.name)')"
        existing_env_names=""
        if [ "$$existing_service" = slate ]; then
          existing_env_names="$$(gcloud run services describe slate --region "$_REGION" --format='value(spec.template.spec.containers[0].env[].name)')"
        fi
        if gcloud secrets versions access latest --secret=slate-invite-code >/dev/null 2>&1; then
          runtime_secrets="$$runtime_secrets,INVITE_CODE=slate-invite-code:latest"
        elif printf '%s' "$$existing_env_names" | tr ';' '\n' | grep -Fx INVITE_CODE >/dev/null; then
          echo "The live service uses INVITE_CODE, but slate-invite-code:latest is not accessible" >&2
          exit 1
        fi
        gcloud run jobs deploy "slate-migrate-$SHORT_SHA" \
          --image "$$image" \
          --region "$_REGION" \
          --command /app/slate \
          --args migrate \
          --set-cloudsql-instances "$PROJECT_ID:$_REGION:slate-postgres-ew1" \
          --set-secrets DATABASE_URL=slate-database-url:latest \
          --set-env-vars "APP_MAX_INSTANCES=1,DB_MAX_CONNECTIONS=1,DB_CONNECTION_ALLOWANCE=$_DB_CONNECTION_ALLOWANCE,DB_RESERVED_CONNECTIONS=$_DB_RESERVED_CONNECTIONS,DB_ACQUIRE_TIMEOUT=$_DB_ACQUIRE_TIMEOUT,DB_STATEMENT_TIMEOUT=$_DB_STATEMENT_TIMEOUT,DB_IDLE_TRANSACTION_TIMEOUT=$_DB_IDLE_TRANSACTION_TIMEOUT,DB_MAX_CONNECTION_IDLE_TIME=$_DB_MAX_CONNECTION_IDLE_TIME,DB_MAX_CONNECTION_LIFETIME=$_DB_MAX_CONNECTION_LIFETIME,REQUEST_TIMEOUT=${_REQUEST_TIMEOUT_SECONDS}s,HTTP_IDLE_TIMEOUT=$_HTTP_IDLE_TIMEOUT" \
          --max-retries 0 \
          --task-timeout 10m \
          --quiet
        job_created=1
        gcloud run jobs execute "slate-migrate-$SHORT_SHA" --region "$_REGION" --wait --quiet

        gcloud run deploy slate \
          --image "$$image" \
          --region "$_REGION" \
          --platform managed \
          --no-invoker-iam-check \
          --no-cpu-throttling \
          --min 1 \
          --max "$_MAX_INSTANCES" \
          --concurrency "$_CONCURRENCY" \
          --timeout "$$(( $_REQUEST_TIMEOUT_SECONDS + 5 ))s" \
          --set-cloudsql-instances "$PROJECT_ID:$_REGION:slate-postgres-ew1" \
          --ingress all \
          --set-env-vars "$$runtime_env" \
          --set-secrets "$$runtime_secrets" \
          --quiet

        deployed="$$(gcloud run services describe slate --region "$_REGION" --format='value(spec.template.spec.containers[0].image)')"
        expected="$$image"
        test "$$deployed" = "$$expected" || {
          echo "Expected deployed image $$expected, got $$deployed" >&2
          exit 1
        }
        effective_max="$$(gcloud run services describe slate --region "$_REGION" --format="value(metadata.annotations.'run.googleapis.com/maxScale')")"
        test "$$effective_max" = "$_MAX_INSTANCES" || {
          echo "Expected maximum instances $_MAX_INSTANCES, got $$effective_max" >&2
          exit 1
        }
        response="$$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 "$_HEALTH_URL")"
        printf '%s\n' "$$response"
        grep -F '"database":"ok"' <<<"$$response"
        grep -F "\"databaseMaxConnections\":$_DB_MAX_CONNECTIONS" <<<"$$response"
        grep -F "\"applicationConnectionLimit\":$$(( $_DB_CONNECTION_ALLOWANCE - $_DB_RESERVED_CONNECTIONS ))" <<<"$$response"
        printf 'Effective capacity: max instances=%s, DB connections/instance=%s, normal app connections=%s, distributed app cap=%s, DB reserve=%s, concurrency/instance=%s\n' \
          "$$effective_max" "$_DB_MAX_CONNECTIONS" "$$((effective_max * $_DB_MAX_CONNECTIONS))" \
          "$$(( $_DB_CONNECTION_ALLOWANCE - $_DB_RESERVED_CONNECTIONS ))" "$_DB_RESERVED_CONNECTIONS" "$_CONCURRENCY"
        REQUESTS=64 CONCURRENCY=16 sh scripts/check-capacity.sh "$_HEALTH_URL"

        gcloud run jobs deploy slate-cleanup \
          --image "$$image" \
          --region "$_REGION" \
          --command /app/slate \
          --args cleanup \
          --set-cloudsql-instances "$PROJECT_ID:$_REGION:slate-postgres-ew1" \
          --set-secrets DATABASE_URL=slate-database-url:latest \
          --set-env-vars "APP_MAX_INSTANCES=1,DB_MAX_CONNECTIONS=1,DB_CONNECTION_ALLOWANCE=$_DB_CONNECTION_ALLOWANCE,DB_RESERVED_CONNECTIONS=$_DB_RESERVED_CONNECTIONS,DB_ACQUIRE_TIMEOUT=$_DB_ACQUIRE_TIMEOUT,DB_STATEMENT_TIMEOUT=$_DB_STATEMENT_TIMEOUT,DB_IDLE_TRANSACTION_TIMEOUT=$_DB_IDLE_TRANSACTION_TIMEOUT,DB_MAX_CONNECTION_IDLE_TIME=$_DB_MAX_CONNECTION_IDLE_TIME,DB_MAX_CONNECTION_LIFETIME=$_DB_MAX_CONNECTION_LIFETIME,REQUEST_TIMEOUT=${_REQUEST_TIMEOUT_SECONDS}s,HTTP_IDLE_TIMEOUT=$_HTTP_IDLE_TIMEOUT" \
          --tasks 1 \
          --parallelism 1 \
          --max-retries 1 \
          --task-timeout 5m \
          --quiet
        cleanup_uri="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/$_REGION/jobs/slate-cleanup:run"
        cleanup_service_account="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
        if gcloud scheduler jobs describe slate-cleanup --location "$_REGION" >/dev/null 2>&1; then
          gcloud scheduler jobs update http slate-cleanup \
            --location "$_REGION" --schedule "17 3 * * *" --time-zone "Etc/UTC" \
            --uri "$$cleanup_uri" --http-method POST \
            --oauth-service-account-email "$$cleanup_service_account" \
            --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
            --attempt-deadline 300s --quiet
        else
          gcloud scheduler jobs create http slate-cleanup \
            --location "$_REGION" --schedule "17 3 * * *" --time-zone "Etc/UTC" \
            --uri "$$cleanup_uri" --http-method POST \
            --oauth-service-account-email "$$cleanup_service_account" \
            --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
            --attempt-deadline 300s --quiet
        fi
images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/slate/slate:$COMMIT_SHA-$BUILD_ID
substitutions:
  _REGION: europe-west1
  _HEALTH_URL: https://slate.do/api/health
  _MAX_INSTANCES: '4'
  _DB_MAX_CONNECTIONS: '2'
  _DB_CONNECTION_ALLOWANCE: '25'
  _DB_RESERVED_CONNECTIONS: '9'
  _DB_ACQUIRE_TIMEOUT: 2s
  _DB_STATEMENT_TIMEOUT: 10s
  _DB_IDLE_TRANSACTION_TIMEOUT: 10s
  _DB_MAX_CONNECTION_IDLE_TIME: 5m
  _DB_MAX_CONNECTION_LIFETIME: 30m
  _REQUEST_TIMEOUT_SECONDS: '15'
  _HTTP_IDLE_TIMEOUT: 60s
  _CONCURRENCY: '16'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
